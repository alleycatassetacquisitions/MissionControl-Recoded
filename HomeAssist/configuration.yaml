# Mission Control — Home Assistant configuration
#
# This file is the source of truth for what Mission Control adds to HA.
# It is NOT a complete configuration.yaml — merge these sections into your
# real HA config/configuration.yaml alongside the default_config block.
#
# Deploy custom components and www files before restarting HA:
#
#   custom_components/core_configurator/  ← Apps/Core_Configurator/HA_Component/custom_components/core_configurator/
#   custom_components/shared_libraries/   ← Libraries/Shared_HA_Helpers/HA_Component/custom_components/shared_libraries/
#   custom_components/registration/       ← Apps/Registration/HA_Component/custom_components/registration/
#   custom_components/digital_node_nexus/ ← Apps/Digital_Node_Nexus/HA_Component/custom_components/digital_node_nexus/
#   custom_components/alleycattv/         ← Apps/AlleycatTV/HA_Component/custom_components/alleycattv/
#   custom_components/broadcast_group_controller/ ← Apps/Broadcast_Group_Controller/HA_Component/custom_components/broadcast_group_controller/
#   www/core_configurator/               ← Apps/Core_Configurator/HA_Component/www/core_configurator/
#   www/shared_libraries/                ← Libraries/Shared_HA_Helpers/HA_Component/www/shared_libraries/
#   www/registration/                    ← Apps/Registration/HA_Component/www/registration/
#   www/digital_node_nexus/              ← Apps/Digital_Node_Nexus/HA_Component/www/digital_node_nexus/
#   www/alleycattv/                      ← Apps/AlleycatTV/HA_Component/www/alleycattv/
#   www/broadcast_group_controller/      ← Apps/Broadcast_Group_Controller/HA_Component/www/broadcast_group_controller/
#
# ─────────────────────────────────────────────────────────────────────────────
# Core Configurator
# ─────────────────────────────────────────────────────────────────────────────
#
# YAML seed: runs once on first boot to populate the config entry.
# After the entry exists this block is ignored — edit URLs and tokens from the
# Core Configurator sidebar. URLs and API tokens both belong here (not in
# per-app config entries).
#
# Copy secrets into config/secrets.yaml (see secrets.yaml.example).

core_configurator:
  # Master Control Server (Proxmox companion — sole Central HTTP adapter)
  master_control_server: !secret cc_master_control_server
  master_control_server_token: !secret cc_master_control_server_token
  # Central Server URLs — pushed to MCS by Registration on every HA start.
  # Change them here and save; Registration propagates the change to MCS automatically.
  central_primary: !secret cc_central_primary
  central_secondary: !secret cc_central_secondary
  # Other services
  alleycattv: !secret cc_alleycattv
  gbn: !secret cc_gbn
  proxmox: !secret cc_proxmox
  proxmox_node: !secret cc_proxmox_node

# Loads AlleycatTV (proxy + WS). Must be `{}` — bare `alleycattv:` is YAML null.
alleycattv: {}

# Loads Broadcast Group Controller (placement + membership).
broadcast_group_controller: {}

frontend:
  extra_module_url:
    # Shared panel kit — must load before any Mission Control panel.
    - /local/shared_libraries/mc-panel.js
    # Core Configurator shared client — must load before any panel that calls
    # window.CoreConfigurator.getUrl.
    - /local/core_configurator/core-configurator-client.js

panel_custom:
  # ─── Core Configurator ────────────────────────────────────────────────────
  - name: core-configurator-panel
    sidebar_title: Core Configurator
    sidebar_icon: mdi:lan
    url_path: core-configurator
    module_url: /local/core_configurator/core-configurator-panel.js

  # ─── Registration ─────────────────────────────────────────────────────────
  - name: registration-panel
    sidebar_title: Registration
    sidebar_icon: mdi:account-group
    url_path: registration
    module_url: /local/registration/registration-panel.js

  # ─── Digital Node Nexus ───────────────────────────────────────────────────
  - name: dnn-panel
    sidebar_title: Digital Node Nexus
    sidebar_icon: mdi:access-point
    url_path: digital-node-nexus
    module_url: /local/digital_node_nexus/dnn-panel.js

  # ─── AlleycatTV ───────────────────────────────────────────────────────────
  - name: alleycattv-panel
    sidebar_title: AlleycatTV
    sidebar_icon: mdi:television-play
    url_path: alleycattv
    module_url: /local/alleycattv/alleycattv-panel.js

  - name: alleycattv-content-panel
    sidebar_title: AlleycatTV Content
    sidebar_icon: mdi:folder-play
    url_path: alleycattv-content
    module_url: /local/alleycattv/alleycattv-content-panel.js

  # ─── Broadcast Group Controller ───────────────────────────────────────────
  - name: broadcast-group-controller-panel
    sidebar_title: Broadcast Groups
    sidebar_icon: mdi:broadcast
    url_path: broadcast-groups
    module_url: /local/broadcast_group_controller/bgc-panel.js
