name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python 3.14 / HA 2026.7.2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run Core Configurator tests
        working-directory: Apps/Core_Configurator/HA_Component
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=custom_components/core_configurator \
            --cov-report=term-missing
