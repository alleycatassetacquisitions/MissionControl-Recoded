# Net Time — chrony configuration for Mission Control venues.
# Install script copies this to /etc/chrony/chrony.conf

confdir /etc/chrony/conf.d
sourcedir /run/chrony-dhcp

# Public pool when the venue has internet. Ignored / unused when unreachable;
# local stratum below keeps answering LAN clients offline.
pool pool.ntp.org iburst maxsources 4

# Serve NTP to the LAN (tighten to your fabric subnet in production if desired).
allow 0.0.0.0/0

# Keep serving when no public sources are available (orphan / local clock).
local stratum 10 orphan

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
keyfile /etc/chrony/chrony.keys
leapsectz right/UTC
logdir /var/log/chrony

makestep 1.0 3
rtcsync
