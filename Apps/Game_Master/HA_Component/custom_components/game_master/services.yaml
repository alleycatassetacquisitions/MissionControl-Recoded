create_event:
  name: Create Event
  description: >
    Create an event on Central via MCS. Optionally set it active afterward.
    Event management lives on Game Master so registration staff cannot
    mis-click set-active.
  fields:
    name:
      name: Name
      description: Event name.
      required: true
      selector:
        text:
    venue_name:
      name: Venue
      description: Optional venue name.
      required: false
      default: ""
      selector:
        text:
    set_active:
      name: Set active
      description: If true, select this event as active after create.
      required: false
      default: false
      selector:
        boolean:

update_event:
  name: Update Event
  description: >
    Patch an event name and/or venue via MCS.
  fields:
    event_id:
      name: Event ID
      description: Event UUID.
      required: true
      selector:
        text:
    name:
      name: Name
      description: New event name (optional).
      required: false
      selector:
        text:
    venue_name:
      name: Venue
      description: New venue name; omit to leave unchanged.
      required: false
      selector:
        text:

set_active_event:
  name: Set Active Event
  description: >
    Select the active event on Central via MCS. Player registration and
    affiliation catalog are scoped to this event.
  fields:
    event_id:
      name: Event ID
      description: Event UUID to make active.
      required: true
      selector:
        text:

create_affiliation_category:
  name: Create Affiliation Category
  description: >
    Create an affiliation category (e.g. Allegiance, Faction) on the active event.
  fields:
    name:
      name: Name
      description: Category name.
      required: true
      selector:
        text:

rename_affiliation_category:
  name: Rename Affiliation Category
  description: Rename an affiliation category on the active event.
  fields:
    category_id:
      name: Category ID
      required: true
      selector:
        text:
    name:
      name: Name
      required: true
      selector:
        text:

create_affiliation:
  name: Create Affiliation
  description: >
    Create an affiliation choice under a category on the active event.
  fields:
    category_id:
      name: Category ID
      required: true
      selector:
        text:
    name:
      name: Name
      required: true
      selector:
        text:

rename_affiliation:
  name: Rename Affiliation
  description: Rename an affiliation choice on the active event.
  fields:
    category_id:
      name: Category ID
      required: true
      selector:
        text:
    affiliation_id:
      name: Affiliation ID
      required: true
      selector:
        text:
    name:
      name: Name
      required: true
      selector:
        text:

set_default_affiliation:
  name: Set Default Affiliation
  description: >
    Set (or clear) the HA-only default choice for a category on the active
    event. Prefills Registration when creating a player; not written to Central.
  fields:
    category_id:
      name: Category ID
      required: true
      selector:
        text:
    affiliation_id:
      name: Affiliation ID
      description: Choice id to use as default; empty clears the default.
      required: false
      selector:
        text:
