sync_now:
  name: Sync Now
  description: >
    Push Central URLs + venue peer snapshot to MCS (MCS fans out to LXC
    companions), then refresh the player roster. Call after changing the
    active event or Core Configurator peer URLs.
  fields: {}

register_player:
  name: Register Player
  description: >
    Register a new player via Master Control Server. MCS forwards JSON name +
    optional email to Central. Requires an active event.
  fields:
    name:
      name: Name
      description: Player's display name (max 32 characters for device UIs).
      required: true
      selector:
        text:
    email:
      name: Email
      description: Optional email address.
      required: false
      default: ""
      selector:
        text:
    affiliations:
      name: Affiliations
      description: >
        Optional map of category UUID to affiliation UUID for the active event.
      required: false
      selector:
        object:

update_player:
  name: Update Player
  description: >
    Update an existing player (name, email, team, active) via MCS → Central PATCH.
  fields:
    player_id:
      name: Player ID
      description: Central Server player id.
      required: true
      selector:
        text:
    name:
      name: Name
      description: Player's display name (max 32 characters for device UIs).
      required: false
      selector:
        text:
    email:
      name: Email
      description: Email address; empty clears it.
      required: false
      selector:
        text:
    affiliations:
      name: Affiliations
      description: >
        Optional map of category UUID to affiliation UUID (null clears a category).
      required: false
      selector:
        object:
    team_id:
      name: Team ID
      description: Team UUID in the active event; empty clears membership.
      required: false
      selector:
        text:
    active:
      name: Active
      description: Registration/device status.
      required: false
      selector:
        boolean:
    clear_email:
      name: Clear email
      description: Explicitly clear email.
      required: false
      default: false
      selector:
        boolean:
    clear_team:
      name: Clear team
      description: Explicitly remove team membership.
      required: false
      default: false
      selector:
        boolean:

delete_player:
  name: Deactivate Player
  description: >
    Soft-deactivate a player (MCS maps this to Central PATCH active=false).
    The player remains on the roster as inactive.
  fields:
    player_id:
      name: Player ID
      description: Central Server player id.
      required: true
      selector:
        text:
