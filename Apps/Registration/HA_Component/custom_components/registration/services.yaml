sync_now:
  name: Sync Now
  description: >
    Push Central URLs to MCS, then refresh the player roster.
    Call after changing the active event.
  fields: {}

register_player:
  name: Register Player
  description: >
    Register a new player via Master Control Server. MCS forwards JSON name +
    optional email to Central. Requires an active event.
  fields:
    name:
      name: Name
      description: Player's display name.
      required: true
      selector:
        text:
    email:
      name: Email
      description: Optional email address.
      required: false
      default: ""
      selector:
        text:

update_player:
  name: Update Player
  description: >
    Update an existing player (name, email, team, active) via MCS → Central PATCH.
  fields:
    player_id:
      name: Player ID
      description: Central Server player id.
      required: true
      selector:
        text:
    name:
      name: Name
      description: Player's display name.
      required: false
      selector:
        text:
    email:
      name: Email
      description: Email address; empty clears it.
      required: false
      selector:
        text:
    team_id:
      name: Team ID
      description: Team UUID in the active event; empty clears membership.
      required: false
      selector:
        text:
    active:
      name: Active
      description: Registration/device status.
      required: false
      selector:
        boolean:
    clear_email:
      name: Clear email
      description: Explicitly clear email.
      required: false
      default: false
      selector:
        boolean:
    clear_team:
      name: Clear team
      description: Explicitly remove team membership.
      required: false
      default: false
      selector:
        boolean:

delete_player:
  name: Deactivate Player
  description: >
    Soft-deactivate a player (MCS maps this to Central PATCH active=false).
    The player remains on the roster as inactive.
  fields:
    player_id:
      name: Player ID
      description: Central Server player id.
      required: true
      selector:
        text:

create_event:
  name: Create Event
  description: >
    Create an event on Central via MCS. Optionally set it active afterward.
  fields:
    name:
      name: Name
      description: Event name.
      required: true
      selector:
        text:
    venue_name:
      name: Venue
      description: Optional venue name.
      required: false
      default: ""
      selector:
        text:
    set_active:
      name: Set active
      description: If true, select this event as active after create.
      required: false
      default: false
      selector:
        boolean:

update_event:
  name: Update Event
  description: >
    Patch an event name and/or venue via MCS.
  fields:
    event_id:
      name: Event ID
      description: Event UUID.
      required: true
      selector:
        text:
    name:
      name: Name
      description: New event name (optional).
      required: false
      selector:
        text:
    venue_name:
      name: Venue
      description: New venue name; omit to leave unchanged.
      required: false
      selector:
        text:

set_active_event:
  name: Set Active Event
  description: >
    Select the active event on Central via MCS. Player registration uses this event.
  fields:
    event_id:
      name: Event ID
      description: Event UUID to make active.
      required: true
      selector:
        text:
