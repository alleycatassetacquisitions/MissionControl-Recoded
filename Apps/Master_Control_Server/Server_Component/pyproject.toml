[project]
name = "master-control-server"
version = "1.0.0"
description = "Master Control Server — sole Central HTTP adapter for Mission Control"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["main", "models", "central_client"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
